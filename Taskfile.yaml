version: "3"

vars:
  HELLO_DIR: payloads/aarch64-hello

tasks:
  build-images:
    desc: Build the QEMU disk images
    dir: images
    cmds:
      - make all

  deploy-hermes:
    desc: Install the Hermes OS as the board's next boot (power the board on and lock it in FirmwareCI first)
    dir: images
    cmds:
      - nix run nixpkgs/nixos-26.05#nixos-rebuild -- boot --flake .#hermes --target-host root@coreboot-hermes.firmwareci.9e.network --use-substitutes

  build-hello-payload:
    desc: Build the aarch64 hello-world coreboot payload (uses a debian:bookworm container so no cross-gcc is required on the host)
    dir: "{{.HELLO_DIR}}"
    vars:
      USER_ID: { sh: id -u }
      GROUP_ID: { sh: id -g }
    sources:
      - hello.S
      - hello.ld
    generates:
      - hello.elf
    cmds:
      - |
        docker run --rm -v "$PWD":/work -w /work debian:bookworm bash -c '
          set -e
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          aarch64-linux-gnu-gcc -nostdlib -ffreestanding -c hello.S -o hello.o
          aarch64-linux-gnu-ld -T hello.ld -nostdlib --no-warn-rwx-segments -o hello.elf hello.o
          chown {{.USER_ID}}:{{.GROUP_ID}} hello.o hello.elf
        '
      - file hello.elf
