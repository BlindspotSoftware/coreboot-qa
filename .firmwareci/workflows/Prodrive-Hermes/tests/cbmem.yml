name: Coreboot Tables / CBMEM
description: Verify coreboot tables and console log are healthy.

defaults:
  transport: &transport
    proto: ssh
    options:
      host: "[[attributes.Host]]"
      user: root
      identity_file: /root/.ssh/fwci

stages:
  - name: Inspect coreboot tables
    steps:
      - cmd: cmd
        name: List CBMEM entries
        transport: *transport
        parameters:
          executable: cbmem
          args: ["-l"]
          expect:
            - regex: "CONSOLE"
            - regex: "TIME STAMP"

      - cmd: cmd
        name: Dump coreboot console
        transport: *transport
        parameters:
          executable: cbmem
          args: ["-c"]
          expect:
            - regex: "coreboot"

      - cmd: cmd
        name: Power off device
        transport: *transport
        parameters:
          executable: shutdown
          args: ["now"]
