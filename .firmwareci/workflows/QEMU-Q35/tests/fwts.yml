name: Run FWTS
description: Flash the provided firmware binary and do firmware validation using FWTS.

defaults:
  transport: &transport
    proto: ssh
    options:
      host: "[[attributes.Host]]"
      port: "[[attributes.Port]]"
      user: root
      identity_file: /root/.ssh/fwci

stages:
  - name: FWTS test
    steps:
      - cmd: cmd
        name: Run FWTS
        transport: *transport
        parameters:
          executable: fwts
          args: ["-r", "stdout", "-q",
		"--skip-test=smm",
                "--skip-test=wakealarm",
                "--skip-test=klog"
		]


          expect:
            - regex: "Critical failures: NONE"
            - regex: "High failures: NONE"
            - regex: "Medium failures: NONE"
            - regex: "Low failures: NONE"
            - regex: "Other failures: NONE"
