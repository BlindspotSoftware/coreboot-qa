name: ACPI Sanity
description: Validate ACPI tables exposed by coreboot.

defaults:
  transport: &transport
    proto: ssh
    options:
      host: "[[attributes.Host]]"
      port: 2223
      user: root

stages:
  - name: Check ACPI tables
    steps:
      - cmd: shell
        name: journalctl reports no errors
        transport: *transport
        parameters:
          command: "! journalctl -b 0 -k -g ACPI 2>&1 | grep -E 'BIOS Error|Firmware Bug'"
