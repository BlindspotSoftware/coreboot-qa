name: Warm Reboot Test
description: Reboot the VM from Linux five times and check that coreboot runs again each time.

defaults:
  transport: &transport
    proto: ssh
    options:
      host: "[[attributes.Host]]"
      port: "[[attributes.Port]]"
      user: root

  reboot: &reboot
    # The delay lets the SSH session close and the next step attach to the
    # serial console before the reboot starts.
    - cmd: shell
      name: Reboot in 3 seconds
      transport: *transport
      parameters:
        command: systemd-run --on-active=3 systemctl reboot

    - cmd: qemu
      name: coreboot and NixOS come back
      options:
        timeout: 3m
      parameters:
        mode: run
        variable: qemu_pid
        serial:
          - expect:
              regex: "bootblock starting"
            timeout: 1m
          - expect:
              regex: "Welcome to NixOS"
            timeout: 2m

    - cmd: ping
      name: SSH is back
      options:
        timeout: 2m
      parameters:
        host: "[[attributes.Host]]"
        # The validator rejects a templated ping port in test files.
        port: 2223

stages:
  - name: Reboot 1
    steps: *reboot
  - name: Reboot 2
    steps: *reboot
  - name: Reboot 3
    steps: *reboot
  - name: Reboot 4
    steps: *reboot
  - name: Reboot 5
    steps: *reboot
