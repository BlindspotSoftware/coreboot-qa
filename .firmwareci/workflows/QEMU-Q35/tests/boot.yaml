name: Boot Test
description: This test is a simple boot test.

defaults:
  transport: &transport
    proto: ssh
    options:
      host: "[[attributes.Host]]"
      port: 2223
      user: root

stages:
  - name: Run Boot Test
    steps:
      - cmd: cmd
        name: Print Kernel Version
        transport: *transport
        parameters:
          executable: uname
          args: ["-a"]

      - cmd: cmd
        name: Print OS Release
        transport: *transport
        parameters:
          executable: cat
          args: ["/etc/os-release"]

      - cmd: cmd
        name: Print BIOS Information
        transport: *transport
        parameters:
          executable: dmidecode
          args: ["-t", "bios"]

      # The pre-stage starts QEMU with -smp 2 -m 2048.
      - cmd: cmd
        name: Both CPUs are up
        transport: *transport
        parameters:
          executable: nproc
          expect:
            - regex: "^2\\s*$"

      - cmd: cmd
        name: Linux sees about 2 GiB of RAM
        transport: *transport
        parameters:
          executable: grep
          args: ["MemTotal", "/proc/meminfo"]
          expect:
            - regex: "MemTotal:\\s+(19|20)[0-9]{5} kB"
