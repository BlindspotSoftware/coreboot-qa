pre-stage:
  - cmd: cmd
    name: Spit firmware image
    transport: { proto: local }
    parameters:
      executable: split
      args: ["-n", "2", "[[input.Binary]]", "part_" ]
  - cmd: qemu
    name: Start NixOS VM with coreboot BIOS (q35)
    parameters:
      mode: start
      args:
        [
          "-M",
          "q35",
          "-m",
          "2048",
          "-smp",
          "2",
          "-nographic",
          "-drive",
          "if=pflash,format=raw,readonly=on,file=part_ab",
          "-drive",
	  "if=pflash,format=raw,file=part_aa",
          "-drive",
          "file=[[storage.OSImage]]/nixos.img,format=raw,if=ide",
          "-nic",
          "user,hostfwd=tcp::[[attributes.Port]]-:22,hostname=qemu",
        ]
      executable: "qemu-system-x86_64"
      firmware: "[[input.Binary]]"
      variable: qemu_pid
      serial:
        - expect:
            regex: "GNU GRUB"
          timeout: 60s
        - expect:
            regex: "Welcome to NixOS"
          timeout: 120s

  - cmd: ping
    name: Ping QEMU Host
    parameters:
      host: localhost
      port: 2223
