pre-stage:
  - cmd: dutctl
    name: Shutdown the DUT.
    parameters:
      agent: "[[attributes.Agent]]"
      device: "[[attributes.Device]]"
      command: power
      args: ["off"]

  - cmd: dutctl
    name: Flash the provided binary.
    parameters:
      agent: "[[attributes.Agent]]"
      device: "[[attributes.Device]]"
      command: flash-write
      args: ["[[input.Binary]]"]

  # The board boots this image from the PiKVM's USB drive. The PiKVM keeps
  # the image, and what the board writes to it, until the image changes.
  - cmd: pikvm
    name: Plug in the system image
    options:
      timeout: 30m
    parameters:
      command: image
      host: "[[attributes.PiKVM]]"
      auth:
        username: coreboot
        password: "[[secrets.PIKVM_PASSWORD]]"
      image:
        path: "[[storage.HermesImage]]/nixos.img"

  - cmd: sleep
    name: Wait for the DUT to settle
    parameters:
      duration: 15s

  - cmd: dutctl
    name: Turn the DUT on
    parameters:
      agent: "[[attributes.Agent]]"
      device: "[[attributes.Device]]"
      command: power
      args: ["hard-reset"]
    options:
      timeout: 2m

  # Keeps the boot log in every job. PROGRESS is the payload's first progress
  # code, so coreboot itself has finished by then.
  - cmd: dutctl
    name: coreboot hands over to the payload
    parameters:
      agent: "[[attributes.Agent]]"
      device: "[[attributes.Device]]"
      command: serial
      args: ["-t", "5m", "expect", "PROGRESS"]
    options:
      timeout: 5m

  - cmd: ping
    name: Wait for the device to become online.
    options:
      timeout: 4m
    parameters:
      host: "[[attributes.Host]]"
