name: build and test
on:
  pull_request:
    paths:
      - .firmwareci/**
      - ci/**
      - images/**
      - payloads/**
      - .github/workflows/build-and-test.yml
  workflow_dispatch:
    inputs:
      coreboot:
        description: coreboot branch or commit to build, upstream main if empty
        required: false

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: qa

      # jenkins.sh checks out every submodule, the blob repos too.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Check out coreboot
        env:
          REF: ${{ inputs.coreboot || 'main' }}
        run: |
          git clone --filter=blob:none --no-checkout https://review.coreboot.org/coreboot.git coreboot
          git -C coreboot checkout "$REF"

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y bison flex libncurses-dev zlib1g-dev

      - name: Restore the toolchain
        id: toolchain
        uses: actions/cache/restore@v6
        with:
          path: coreboot/util/crossgcc/xgcc
          key: crossgcc-i386-aarch64-${{ hashFiles('coreboot/util/crossgcc/buildgcc', 'coreboot/util/crossgcc/sum/*') }}

      # The same script Jenkins runs, so a PR that breaks it fails here.
      - name: Build the QEMU roms
        working-directory: coreboot
        env:
          TARGETS: q35 aarch64
          SUBMIT: "0"
          HELLO_ELF: ${{ github.workspace }}/qa/payloads/aarch64-hello/hello.elf
        run: ../qa/ci/jenkins.sh

      # Saved also when the rom build fails, so the next run skips the toolchain build.
      - name: Save the toolchain
        if: always() && steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: coreboot/util/crossgcc/xgcc
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v7
        with:
          name: roms
          path: coreboot/artifacts/*.rom
          if-no-files-found: error

  q35:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Give QEMU KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The image and its per-test copy don't fit the runner's free disk.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/download-artifact@v8
        with:
          name: roms
          path: roms

      - name: Restore the OS image
        id: image
        uses: actions/cache/restore@v6
        with:
          path: os-image
          key: os-image-${{ hashFiles('images/flake.nix', 'images/flake.lock') }}

      - uses: cachix/install-nix-action@v31
        if: steps.image.outputs.cache-hit != 'true'

      - name: Build the OS image
        if: steps.image.outputs.cache-hit != 'true'
        run: |
          nix build ./images#qemu --out-link qemu-image
          mkdir -p os-image
          cp --sparse=always qemu-image/nixos.img os-image/

      - name: Save the OS image
        if: steps.image.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: os-image
          key: ${{ steps.image.outputs.cache-primary-key }}

      - uses: BlindspotSoftware/actions@v8
        with:
          workflow: QEMU-Q35
          local: true
          binaries: Binary=roms/coreboot-qemu-q35.rom
          storage: OSImage=os-image

  aarch64:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: roms
          path: roms

      - uses: BlindspotSoftware/actions@v8
        with:
          workflow: QEMU-AArch64
          local: true
          binaries: Binary=roms/coreboot-qemu-aarch64.rom
